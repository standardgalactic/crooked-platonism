name: Lean CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lean
        uses: leanprover-community/setup-lean@v1

      - name: Build project
        run: lake build

      - name: Run tests (if any)
        run: lake test || true